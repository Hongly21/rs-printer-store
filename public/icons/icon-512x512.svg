<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pwaGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="pwaShadow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#pwaGrad512)"/>
  <g filter="url(#pwaShadow512)" transform="translate(96, 96)">
    <!-- Printer top sheet -->
    <rect x="70" y="16" width="180" height="80" rx="16" fill="#f8fafc" opacity="0.95"/>
    <line x1="100" y1="48" x2="220" y2="48" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
    <line x1="100" y1="70" x2="180" y2="70" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Printer main body -->
    <rect x="30" y="80" width="260" height="136" rx="40" fill="#ffffff"/>
    <circle cx="76" cy="148" r="14" fill="#38bdf8"/>
    <rect x="110" y="136" width="150" height="24" rx="12" fill="#e2e8f0"/>
    
    <!-- Printed sheet coming out with CMYK dots -->
    <rect x="60" y="174" width="200" height="120" rx="20" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="4"/>
    <circle cx="96" cy="232" r="14" fill="#0284c7"/>
    <circle cx="136" cy="232" r="14" fill="#ec4899"/>
    <circle cx="176" cy="232" r="14" fill="#eab308"/>
    <circle cx="216" cy="232" r="14" fill="#0f172a"/>
    <line x1="86" y1="268" x2="234" y2="268" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
