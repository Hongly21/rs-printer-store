<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="pwaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="pwaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#pwaGrad)"/>
  <!-- Printer / Craft Glyph -->
  <g filter="url(#pwaShadow)" transform="translate(36, 36)">
    <!-- Printer top sheet -->
    <rect x="25" y="6" width="70" height="30" rx="6" fill="#f8fafc" opacity="0.95"/>
    <line x1="38" y1="18" x2="82" y2="18" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="38" y1="26" x2="68" y2="26" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Printer main body -->
    <rect x="10" y="30" width="100" height="52" rx="16" fill="#ffffff"/>
    <circle cx="28" cy="56" r="5" fill="#38bdf8"/>
    <rect x="42" y="52" width="58" height="8" rx="4" fill="#e2e8f0"/>
    
    <!-- Printed sheet coming out with CMYK bar -->
    <rect x="22" y="66" width="76" height="46" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="36" cy="88" r="5" fill="#0284c7"/>
    <circle cx="52" cy="88" r="5" fill="#ec4899"/>
    <circle cx="68" cy="88" r="5" fill="#eab308"/>
    <circle cx="84" cy="88" r="5" fill="#0f172a"/>
    <line x1="32" y1="102" x2="88" y2="102" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
