<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <rect width="320" height="240" rx="16" fill="#f8fafc"/>
  <g transform="translate(60, 30)">
    <!-- Shop counter -->
    <rect x="10" y="80" width="180" height="80" rx="8" fill="#334155"/>
    <rect x="20" y="90" width="160" height="15" rx="4" fill="#64748b"/>
    <!-- POS / Cash Terminal -->
    <rect x="40" y="40" width="45" height="40" rx="6" fill="#0f172a"/>
    <rect x="45" y="45" width="35" height="20" rx="3" fill="#38bdf8"/>
    <rect x="45" y="70" width="35" height="6" rx="2" fill="#64748b"/>
    <!-- Cash note & coins -->
    <rect x="105" y="55" width="60" height="30" rx="4" fill="#22c55e" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))"/>
    <circle cx="135" cy="70" r="8" fill="#15803d"/>
    <text x="135" y="74" font-family="system-ui" font-weight="900" font-size="10" fill="#ffffff" text-anchor="middle">$</text>
    <circle cx="100" cy="75" r="8" fill="#eab308"/>
  </g>
  <text x="160" y="195" font-family="system-ui" font-weight="700" font-size="14" fill="#0f172a" text-anchor="middle">Pay at Shop or Cash on Delivery</text>
  <text x="160" y="215" font-family="system-ui" font-weight="500" font-size="11" fill="#64748b" text-anchor="middle">Cash or Card upon receipt</text>
</svg>
