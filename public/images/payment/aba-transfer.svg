    <text x="20" y="105" font-family="system-ui" font-weight="700" font-size="10" fill="#a7f3d0">PRINTCRAFT STUDIO CO.</text>
  </g>
  <text x="160" y="195" font-family="system-ui" font-weight="700" font-size="14" fill="#0f172a" text-anchor="middle">Direct Bank Transfer</text>
  <text x="160" y="215" font-family="system-ui" font-weight="500" font-size="11" fill="#64748b" text-anchor="middle">ABA Bank &amp; ACLEDA Bank</text>
