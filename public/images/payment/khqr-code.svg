<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" fill="none">
  <!-- Card container -->
  <rect width="320" height="380" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.08))"/>
  
  <!-- Header with KHQR Banner -->
  <rect width="320" height="65" rx="20" fill="#dc2626"/>
  <rect y="45" width="320" height="20" fill="#dc2626"/>
  <text x="160" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="3">KHQR</text>
  <text x="160" y="54" font-family="system-ui" font-weight="600" font-size="10" fill="#fecaca" text-anchor="middle">BAKONG • ABA • ALL BANKS</text>
  
  <!-- Account Details -->
  <text x="160" y="92" font-family="system-ui" font-weight="800" font-size="15" fill="#0f172a" text-anchor="middle">PRINTCRAFT STUDIO</text>
  <text x="160" y="110" font-family="system-ui" font-weight="600" font-size="12" fill="#64748b" text-anchor="middle">Merchant ID: 001889922 (USD)</text>
  
  <!-- QR Code Graphics Mockup -->
  <g transform="translate(60, 130)">
    <!-- QR border -->
    <rect width="200" height="200" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Corner Finder Patterns -->
    <!-- Top-Left -->
    <rect x="15" y="15" width="45" height="45" rx="8" fill="#0f172a"/>
    <rect x="23" y="23" width="29" height="29" rx="4" fill="#ffffff"/>
    <rect x="29" y="29" width="17" height="17" rx="3" fill="#0f172a"/>
    
    <!-- Top-Right -->
    <rect x="140" y="15" width="45" height="45" rx="8" fill="#0f172a"/>
    <rect x="148" y="23" width="29" height="29" rx="4" fill="#ffffff"/>
    <rect x="154" y="29" width="17" height="17" rx="3" fill="#0f172a"/>
    
    <!-- Bottom-Left -->
    <rect x="15" y="140" width="45" height="45" rx="8" fill="#0f172a"/>
    <rect x="23" y="148" width="29" height="29" rx="4" fill="#ffffff"/>
    <rect x="29" y="154" width="17" height="17" rx="3" fill="#0f172a"/>
    
    <!-- QR Data Matrix Dots -->
    <!-- Center blocks -->
    <rect x="75" y="20" width="10" height="25" rx="2" fill="#0f172a"/>
    <rect x="95" y="15" width="12" height="12" rx="2" fill="#0f172a"/>
    <rect x="115" y="25" width="15" height="10" rx="2" fill="#0f172a"/>
    
    <rect x="20" y="75" width="20" height="10" rx="2" fill="#0f172a"/>
    <rect x="50" y="70" width="15" height="20" rx="2" fill="#0f172a"/>
    <rect x="75" y="65" width="25" height="25" rx="4" fill="#0f172a"/>
    <rect x="110" y="75" width="18" height="18" rx="3" fill="#0f172a"/>
    <rect x="140" y="70" width="25" height="12" rx="2" fill="#0f172a"/>
    <rect x="170" y="75" width="12" height="25" rx="2" fill="#0f172a"/>

    <rect x="20" y="105" width="30" height="15" rx="2" fill="#0f172a"/>
    <rect x="60" y="100" width="15" height="15" rx="2" fill="#0f172a"/>
    
    <!-- Center Logo Badge -->
    <rect x="80" y="80" width="40" height="40" rx="10" fill="#dc2626"/>
    <text x="100" y="105" font-family="system-ui" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">$</text>
    
    <rect x="130" y="105" width="20" height="15" rx="2" fill="#0f172a"/>
    <rect x="160" y="110" width="22" height="12" rx="2" fill="#0f172a"/>

    <rect x="70" y="140" width="20" height="20" rx="3" fill="#0f172a"/>
    <rect x="100" y="135" width="30" height="12" rx="2" fill="#0f172a"/>
    <rect x="140" y="145" width="15" height="25" rx="2" fill="#0f172a"/>
    <rect x="165" y="140" width="18" height="18" rx="3" fill="#0f172a"/>

    <rect x="75" y="170" width="15" height="15" rx="2" fill="#0f172a"/>
    <rect x="100" y="160" width="25" height="20" rx="3" fill="#0f172a"/>
    <rect x="135" y="175" width="48" height="12" rx="2" fill="#0f172a"/>
  </g>
  
  <text x="160" y="355" font-family="system-ui" font-weight="600" font-size="11" fill="#94a3b8" text-anchor="middle">Scan with any mobile banking app</text>
