<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="card-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gold-foil-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="#f8fafc"/>
  <!-- Card 1 (Dark Foil) -->
  <g transform="translate(60, 50) rotate(-10)">
    <rect width="220" height="130" rx="10" fill="url(#card-dark)" filter="drop-shadow(0 14px 28px rgba(0,0,0,0.2))"/>
    <circle cx="110" cy="55" r="22" fill="url(#gold-foil-grad)"/>
    <text x="110" y="61" font-family="system-ui" font-weight="900" font-size="16" fill="#0f172a" text-anchor="middle">PC</text>
    <text x="110" y="96" font-family="system-ui" font-weight="800" font-size="12" fill="url(#gold-foil-grad)" text-anchor="middle" letter-spacing="3">PRINTCRAFT</text>
  </g>
  <!-- Card 2 (White Minimal) -->
  <g transform="translate(130, 95) rotate(8)">
    <rect width="220" height="130" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="drop-shadow(0 16px 32px rgba(0,0,0,0.12))"/>
    <rect x="25" y="25" width="32" height="32" rx="8" fill="#0284c7"/>
    <path d="M35 41 L 47 41 M 41 35 L 41 47" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <text x="68" y="38" font-family="system-ui" font-weight="800" font-size="13" fill="#0f172a">EMMA WATSON</text>
    <text x="68" y="50" font-family="system-ui" font-weight="600" font-size="9" fill="#0284c7">Managing Director</text>
    <line x1="25" y1="70" x2="195" y2="70" stroke="#f1f5f9" stroke-width="2"/>
    <text x="25" y="88" font-family="system-ui" font-weight="500" font-size="9" fill="#475569">+1 (555) 349-9201</text>
    <text x="25" y="104" font-family="system-ui" font-weight="500" font-size="9" fill="#64748b">hello@printcraftstudio.com</text>
  </g>
</svg>
