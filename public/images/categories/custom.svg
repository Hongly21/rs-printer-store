<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" fill="none">
  <rect width="300" height="220" rx="16" fill="#fdf2f8"/>
  <!-- Acrylic Charm & Standee -->
  <g transform="translate(80, 25)">
    <!-- Base Plate -->
    <ellipse cx="70" cy="165" rx="55" ry="14" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
    <rect x="58" y="158" width="24" height="12" rx="2" fill="#64748b"/>
    <!-- Acrylic Body -->
    <path d="M40 50 Q 70 30 100 50 Q 115 90 95 155 L 45 155 Q 25 90 40 50 Z" fill="#fbcfe8" fill-opacity="0.6" stroke="#f472b6" stroke-width="3" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.1))"/>
    <!-- Character/Logo printed inside -->
    <circle cx="70" cy="85" r="22" fill="#ec4899"/>
    <polygon points="70,72 74,80 83,81 76,87 78,96 70,91 62,96 64,87 57,81 66,80" fill="#fef08a"/>
    <text x="70" y="130" font-family="system-ui" font-weight="800" font-size="10" fill="#9d174d" text-anchor="middle">ACRYLIC</text>
  </g>
</svg>
