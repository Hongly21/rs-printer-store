<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" fill="none">
  <rect width="300" height="220" rx="16" fill="#f0f9ff"/>
  <!-- Rollup banner stand -->
  <g transform="translate(60, 20)">
    <!-- Hanging Banner -->
    <rect x="30" y="20" width="130" height="150" rx="4" fill="#0284c7" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.15))"/>
    <!-- Banner Grommets -->
    <circle cx="36" cy="26" r="3" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>
    <circle cx="154" cy="26" r="3" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>
    <circle cx="36" cy="164" r="3" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>
    <circle cx="154" cy="164" r="3" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>
    <!-- Graphic -->
    <rect x="42" y="38" width="106" height="40" rx="4" fill="#38bdf8" opacity="0.4"/>
    <text x="95" y="64" font-family="system-ui" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">BIG SALE</text>
    <text x="95" y="105" font-family="system-ui" font-weight="800" font-size="20" fill="#fef08a" text-anchor="middle">UP TO 70%</text>
    <rect x="60" y="125" width="70" height="16" rx="4" fill="#ffffff"/>
    <text x="95" y="137" font-family="system-ui" font-weight="700" font-size="8" fill="#0369a1" text-anchor="middle">SHOP TODAY</text>
  </g>
</svg>
