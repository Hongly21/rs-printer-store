<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" fill="none">
  <rect width="300" height="220" rx="16" fill="#f8fafc"/>
  <!-- Card 1 back -->
  <g transform="translate(50, 65) rotate(-6)">
    <rect width="180" height="105" rx="8" fill="#0f172a" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.15))"/>
    <circle cx="90" cy="45" r="18" fill="#38bdf8" opacity="0.3"/>
    <text x="90" y="50" font-family="system-ui" font-weight="800" font-size="14" fill="#38bdf8" text-anchor="middle">STUDIO</text>
    <rect x="50" y="75" width="80" height="4" rx="2" fill="#64748b"/>
  </g>
  <!-- Card 2 front -->
