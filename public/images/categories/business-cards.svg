    <line x1="20" y1="58" x2="160" y2="58" stroke="#f1f5f9" stroke-width="1.5"/>
    <text x="20" y="72" font-family="system-ui" font-weight="500" font-size="8" fill="#475569">+1 (555) 019-2834</text>
    <text x="20" y="85" font-family="system-ui" font-weight="500" font-size="8" fill="#0284c7">alex@designstudio.com</text>
